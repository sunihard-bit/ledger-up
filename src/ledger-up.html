<title>Ledger Up POA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky score bar on top, one view at a time, tab bar fixed at the bottom. Ledger-book greens, gold for rewards, red ink for mistakes. */
:root{
  --bg:#EEF3F0; --paper:#FFFFFF; --ink:#13241F; --muted:#5A6E67; --line:#D3DFD9;
  --green:#0D6A58; --green-2:#0A5246; --green-soft:#DCEDE7;
  --gold:#D89A12; --gold-soft:#FBEFD2;
  --red:#C23B33; --red-soft:#F8E1DE;
  --blue:#2C5FA8; --blue-soft:#E1EAF7;
  --on-green:#FFFFFF;
  --dr:#1F5FC4; --dr-soft:#E0EAFA; --cr:#C9620F; --cr-soft:#FBE8D6; --coin:#B7860B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --nav-h:64px; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1714; --paper:#15221E; --ink:#E6F0EC; --muted:#93A9A1; --line:#26372F;
  --green:#3FB89B; --green-2:#2E9C82; --green-soft:#173A31;
  --gold:#F0B93A; --gold-soft:#3A2E12; --red:#F07A70; --red-soft:#3D1D1A;
  --blue:#7FA8E8; --blue-soft:#1A2A42; --on-green:#06201A;
  --dr:#78A6F0; --dr-soft:#1B2B47; --cr:#F2A25C; --cr-soft:#3D2814; --coin:#F0C34A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1714; --paper:#15221E; --ink:#E6F0EC; --muted:#93A9A1; --line:#26372F;
  --green:#3FB89B; --green-2:#2E9C82; --green-soft:#173A31;
  --gold:#F0B93A; --gold-soft:#3A2E12; --red:#F07A70; --red-soft:#3D1D1A;
  --blue:#7FA8E8; --blue-soft:#1A2A42; --on-green:#06201A;
  --dr:#78A6F0; --dr-soft:#1B2B47; --cr:#F2A25C; --cr-soft:#3D2814; --coin:#F0C34A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--green-2)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--green-2);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;opacity:.75;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.flame{color:#FFD27A}
.xpbar{height:4px;background:rgba(255,255,255,.18)}
.xpbar i{display:block;height:100%;background:#FFC94A;transition:width .6s ease}

/* views */
main{padding-block:16px 8px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:18px;margin-bottom:6px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--green);color:var(--on-green);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--green-soft);color:var(--green)}
.btn.gold{background:var(--gold);color:#241800}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.chip:hover{border-color:var(--green)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}

/* hero */
.hero{background:var(--green);color:var(--on-green);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero h2{font-size:26px}
.hero .ledgerlines{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(255,255,255,.08) 27px 28px);pointer-events:none}
.hero .ledgerlines::after{content:"";position:absolute;top:0;bottom:0;right:84px;border-left:2px solid rgba(255,120,110,.35)}
.hero > *{position:relative}
.goal{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(#FFC94A calc(var(--p)*1%),rgba(255,255,255,.2) 0);display:grid;place-items:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.85}

/* topics */
.sec-h{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.sec-h h3{font-size:16px}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%}
.titem .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:24px}
.titem b{display:block;font-weight:700;line-height:1.25}
.titem .sub{font-size:13px;color:var(--muted)}
.mastery{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.mastery.good{background:var(--green-soft);color:var(--green)}
.mastery.mid{background:var(--gold-soft);color:var(--gold)}
.mastery.low{background:var(--red-soft);color:var(--red)}
.notes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* answer / markdown */
.md{min-width:0;overflow-wrap:anywhere}
.md p{margin:0 0 10px}
.md h3,.md h4,.md h5,.md h6{margin:14px 0 6px;font-size:17px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin-bottom:4px}
.md code{font-family:var(--f-mono);font-size:.9em;background:var(--green-soft);padding:1px 5px;border-radius:5px}
.md pre{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;white-space:pre;margin:0 0 10px}
.md .tbl{overflow-x:auto;margin:0 0 10px;border:1px solid var(--line);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.md th,.md td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.md th{background:var(--green-soft);font-weight:700}
.md tr:last-child td{border-bottom:0}
.md hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
.thinking{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-style:italic}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:3px;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* quiz */
.qcard{display:flex;flex-direction:column;gap:12px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qprog{display:flex;gap:4px;flex:1}
.qprog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.qprog i.ok{background:var(--green)}.qprog i.bad{background:var(--red)}.qprog i.now{background:var(--gold)}
.qtext{font-size:18px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);width:100%}
.opt .L{font-family:var(--f-mono);font-weight:700;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .L{background:var(--green);color:var(--on-green)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .L{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--green-soft)}
.fb.bad{background:var(--red-soft)}
.fb h4{font-size:17px}
.fb .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fixbox{border-left:3px solid var(--gold);padding-left:10px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.msg{max-width:92%;padding:10px 13px;border-radius:16px;min-width:0}
.msg.me{align-self:flex-end;background:var(--green);color:var(--on-green);border-bottom-right-radius:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px;width:92%}
.msg.ai .md p:last-child{margin-bottom:0}
.msg .imgtag{display:block;font-size:12px;opacity:.85;margin-top:4px}
.composer{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 4px);background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;z-index:5}
.cbox{display:flex;gap:8px;align-items:flex-end;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:6px}
.cbox textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:8px;max-height:140px;outline:none}
.iconbtn{width:42px;height:42px;border-radius:12px;border:0;display:grid;place-items:center;background:var(--green-soft);color:var(--green);flex:none}
.iconbtn.send{background:var(--green);color:var(--on-green)}
.iconbtn svg{width:20px;height:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips .chip{white-space:nowrap;flex:none}
.attach{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--gold-soft);border-radius:10px;padding:6px 10px}
.attach img{width:36px;height:36px;object-fit:cover;border-radius:6px}

/* forms */
textarea.field,input.field,select.field{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px}
textarea.field{min-height:96px;resize:vertical;font-family:var(--f-body)}
textarea.mono{font-family:var(--f-mono);font-size:14px}
label.lab{font-weight:600;font-size:14px;display:block;margin-bottom:4px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:4px}
.badge .medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;background:var(--line);color:var(--muted)}
.badge.got .medal{background:var(--gold);color:#241800;box-shadow:0 0 0 3px var(--gold-soft)}
.badge b{font-size:13px;line-height:1.2}
.badge span{font-size:11px;color:var(--muted);line-height:1.25}

/* game */
.game{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.gcard{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:10px;transition:transform .15s}
.gcard.flashok{border-color:var(--green);background:var(--green-soft)}
.gcard.flashbad{border-color:var(--red);background:var(--red-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gcard .acct{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--green);background:var(--green-soft);align-self:center;padding:4px 10px;border-radius:8px}
.gcard .tx{font-size:19px;font-weight:600}
.dc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dc .btn{min-height:72px;font-size:22px;font-family:var(--f-display)}
.timer{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.big{font-family:var(--f-display);font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--green)}
nav.tabs button.on svg{stroke-width:2.4}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.gold{background:var(--gold);color:#241800}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:14px}
.linkcard{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--paper)}
.linkcard b{color:var(--blue)}
.back{border:0;background:none;color:var(--green);font-weight:700;padding:4px 0;align-self:flex-start}
.mistake{border-left:3px solid var(--red);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:4px}
.part{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.score{display:inline-block;font-family:var(--f-mono);font-weight:700;padding:2px 8px;border-radius:8px;background:var(--gold-soft);color:var(--gold)}

/* ---- themes bought in the shop (accent family only) ---- */
.th-carnival{--green:#6A2C9E;--green-2:#4B1D73;--green-soft:#EEE4F7}
.th-maracas{--green:#0F6FA8;--green-2:#0B5480;--green-soft:#DDEEF8}
.th-ibis{--green:#BF3A2B;--green-2:#8E2A20;--green-soft:#F9E0DC}
.th-pan{--green:#3E5566;--green-2:#2B3D4A;--green-soft:#E2E9EE}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]) .th-carnival{--green:#B98AE6;--green-2:#4B2470;--green-soft:#2E1F40}
 :root:not([data-theme="light"]) .th-maracas{--green:#5BB8EA;--green-2:#12507A;--green-soft:#16324A}
 :root:not([data-theme="light"]) .th-ibis{--green:#F2857A;--green-2:#7E261D;--green-soft:#3D1E1B}
 :root:not([data-theme="light"]) .th-pan{--green:#9DB4C4;--green-2:#2E4352;--green-soft:#1E2A33}}
:root[data-theme="dark"] .th-carnival{--green:#B98AE6;--green-2:#4B2470;--green-soft:#2E1F40}
:root[data-theme="dark"] .th-maracas{--green:#5BB8EA;--green-2:#12507A;--green-soft:#16324A}
:root[data-theme="dark"] .th-ibis{--green:#F2857A;--green-2:#7E261D;--green-soft:#3D1E1B}
:root[data-theme="dark"] .th-pan{--green:#9DB4C4;--green-2:#2E4352;--green-soft:#1E2A33}

/* ---- header extras ---- */
.avatarbtn{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;flex:none;padding:0}
.pill.coin{color:#FFE08A}
.coinico{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#F4C84A;color:#5A3D00;font-size:10px;font-weight:800;font-family:var(--f-mono)}

/* ---- debit / credit colour coding ---- */
.dr{color:var(--dr)} .cr{color:var(--cr)}
.tag-dr,.tag-cr{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:13px;font-weight:600;padding:3px 8px;border-radius:8px}
.tag-dr{background:var(--dr-soft);color:var(--dr)} .tag-cr{background:var(--cr-soft);color:var(--cr)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}

/* ---- visuals ---- */
.vis{display:flex;flex-direction:column;gap:10px;min-width:0}
.vis-title{font-family:var(--f-display);font-weight:600;font-size:16px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tacc{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;min-width:0;background:var(--paper);border-radius:8px}
.tacc .tn{text-align:center;font-weight:700;font-family:var(--f-body);font-size:13px;padding:3px 0;border-bottom:2px solid var(--ink)}
.tacc .tb{display:grid;grid-template-columns:1fr 1fr}
.tacc .side{display:flex;flex-direction:column;padding:4px 4px 6px;min-width:0}
.tacc .side.d{border-right:2px solid var(--ink)}
.tacc .sh{font-size:10px;font-weight:700;letter-spacing:.08em;margin-bottom:2px}
.tacc .side.d .sh{color:var(--dr)} .tacc .side.c .sh{color:var(--cr);text-align:right}
.tacc .e{display:flex;justify-content:space-between;gap:4px;padding:2px 3px;border-radius:4px}
.tacc .e span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tacc .side.d .e b{color:var(--dr)} .tacc .side.c .e b{color:var(--cr)}
.tacc .e b{font-weight:600}
.tacc .e.cd{color:var(--muted)}
.tacc .e.tot{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);border-radius:0;margin-top:2px}
.tacc .e.bd{font-weight:700}
.tacc .e.new{animation:pop 1.1s ease}
.tacc .side.d .e.new{background:var(--dr-soft)} .tacc .side.c .e.new{background:var(--cr-soft)}
@keyframes pop{0%{transform:translateY(-8px) scale(1.08);opacity:0}35%{opacity:1;transform:none}100%{}}
.cap{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.cap .tx{font-weight:700}
.stepper{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dots2{display:flex;gap:4px}.dots2 i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots2 i.on{background:var(--green)}

<script>
/* =================== CONTENT =================== */
const SECTIONS = [
  {id:"s1", name:"Getting started"},
  {id:"s2", name:"Recording transactions"},
  {id:"s3", name:"Checking the books"},
  {id:"s4", name:"Financial statements"},
  {id:"s5", name:"Other types of organisation"},
];
const TOPICS = [
 {id:"intro",sec:"s1",name:"Introduction to Accounting",short:"Purpose of accounting, users of accounts, and accounting concepts",
  notes:["Bookkeeping records transactions; accounting summarises, analyses and explains them.","Users include owners, managers, banks (e.g. Republic Bank, First Citizens), suppliers, BIR/tax authorities and employees.","Key concepts: business entity, going concern, consistency, prudence, accruals (matching), materiality, historical cost, dual aspect.","Business entity: the owner and the business are kept separate, even for a one-man doubles stand."]},
 {id:"equation",sec:"s1",name:"The Accounting Equation",short:"Assets = Capital + Liabilities and how transactions change it",
  notes:["Assets = Capital + Liabilities. So Capital = Assets − Liabilities.","Every transaction changes at least two items, and the equation always stays balanced.","Capital only changes when the owner puts in or takes out resources, or when the business makes a profit or loss.","Practise: show the effect of each transaction in a table of + and − columns."]},
 {id:"sourcedocs",sec:"s2",name:"Source Documents & Books of Original Entry",short:"Invoices, credit notes, receipts and the journals they go into",
  notes:["Invoice → Sales Journal (sent) or Purchases Journal (received). Only goods for resale on credit go here.","Credit note sent → Returns Inwards (Sales Returns) Journal. Credit note received → Returns Outwards Journal.","Receipts and cheque counterfoils → Cash Book.","Anything else (non-current assets on credit, corrections, opening entries) → General Journal, with a narration."]},
 {id:"doubleentry",sec:"s2",name:"Double Entry & the Ledger",short:"Debit and credit rules, posting and balancing accounts",
  notes:["DEAD CLIC: Debit increases Expenses, Assets, Drawings. Credit increases Liabilities, Income, Capital.","Every debit has a matching credit for the same amount.","To balance: add the bigger side, put the difference on the smaller side as 'Balance c/d', then bring it down on the other side as 'Balance b/d'.","Sales ledger = customers (debtors). Purchases ledger = suppliers (creditors). General ledger = everything else."]},
 {id:"cashbook",sec:"s2",name:"Cash Book & Petty Cash",short:"Two and three-column cash books, discounts, imprest system",
  notes:["The cash book is both a book of original entry and a ledger account for cash and bank.","Three-column: Discount, Cash, Bank. Discount allowed on the debit side, discount received on the credit side.","Contra entries: cash paid into bank appears on both sides (marked 'C').","Imprest system: petty cashier starts each period with a fixed float; reimbursement = amount spent."]},
 {id:"trialbalance",sec:"s2",name:"Trial Balance & Correcting Errors",short:"Preparing a trial balance, the six errors it misses, suspense accounts",
  notes:["Debit balances = assets, expenses, drawings. Credit balances = capital, liabilities, income.","Errors NOT shown by a trial balance: omission, commission, principle, original entry, complete reversal, compensating.","If the totals disagree, put the difference in a Suspense account, then clear it with journal entries as errors are found.","Correct errors with General Journal entries and a narration."]},
 {id:"bankrec",sec:"s3",name:"Bank Reconciliation",short:"Updating the cash book and reconciling with the bank statement",
  notes:["Step 1: update the cash book with items only on the bank statement (bank charges, standing orders, credit transfers, dishonoured cheques).","Step 2: prepare the statement starting from the updated cash book balance.","Add unpresented cheques; subtract lodgements (deposits) not yet credited.","Remember: the bank statement is from the bank's view, so a debit balance there is an overdraft."]},
 {id:"control",sec:"s3",name:"Control Accounts",short:"Sales and purchases ledger control accounts",
  notes:["A control account checks the accuracy of a whole ledger with one total account.","Sales Ledger Control: debit side has opening debtors, credit sales, dishonoured cheques; credit side has cash/cheques received, discounts allowed, returns inwards, bad debts, set-offs.","Purchases Ledger Control is the mirror image.","Cash sales and cash purchases never go in a control account."]},
 {id:"finalaccounts",sec:"s4",name:"Income Statement & Statement of Financial Position",short:"Final accounts of a sole trader",
  notes:["Cost of sales = opening inventory + net purchases + carriage inwards − closing inventory.","Gross profit = net sales − cost of sales. Net profit = gross profit + other income − expenses.","Statement of Financial Position: non-current assets, current assets, current liabilities, non-current liabilities, then capital + net profit − drawings.","Carriage inwards goes in cost of sales; carriage outwards is an expense."]},
 {id:"adjustments",sec:"s4",name:"Adjustments: Accruals, Prepayments, Depreciation, Bad Debts",short:"Year-end adjustments to final accounts",
  notes:["Accrued expense: add to the expense; show as a current liability.","Prepaid expense: subtract from the expense; show as a current asset.","Straight-line depreciation = (cost − residual value) ÷ useful life. Reducing balance = rate × net book value.","Bad debts are an expense. A provision for doubtful debts is deducted from trade receivables; only the increase or decrease goes to the income statement."]},
 {id:"inventory",sec:"s4",name:"Inventory Valuation",short:"FIFO, AVCO and lower of cost and net realisable value",
  notes:["FIFO: the first items bought are the first sold, so closing inventory is valued at the latest prices.","AVCO (weighted average): recalculate the average cost after each purchase.","Inventory is valued at the lower of cost and net realisable value (prudence).","Different methods give different profits, so be consistent from year to year."]},
 {id:"ratios",sec:"s4",name:"Interpreting Accounts (Ratios)",short:"Profitability and liquidity ratios",
  notes:["Gross profit margin = GP ÷ net sales × 100. Net profit margin = NP ÷ net sales × 100.","Current ratio = current assets : current liabilities. Acid test = (current assets − inventory) : current liabilities.","Return on capital employed (ROCE) = net profit ÷ capital employed × 100.","Rate of inventory turnover = cost of sales ÷ average inventory."]},
 {id:"partnership",sec:"s5",name:"Partnerships",short:"Appropriation account, capital and current accounts",
  notes:["The appropriation account shares out net profit: add interest on drawings, take off interest on capital and partners' salaries, then share the rest in the profit-sharing ratio.","With no partnership agreement: share profits equally, no interest on capital, no salaries, 5% interest on partners' loans.","Fixed capital accounts plus current accounts for each partner.","Partners' salaries are NOT an expense; they go in the appropriation account."]},
 {id:"companies",sec:"s5",name:"Limited Liability Companies",short:"Shares, debentures, dividends and company accounts",
  notes:["Ordinary shareholders own the company and get variable dividends.","Preference shareholders get a fixed dividend before ordinary shareholders.","Debenture holders are lenders: they receive interest (an expense), not dividends.","Retained earnings are profits kept in the business after dividends."]},
 {id:"npo",sec:"s5",name:"Non-Profit Organisations",short:"Clubs and societies: receipts and payments, income and expenditure",
  notes:["Receipts and Payments account = summary of cash in and out (like a cash book).","Income and Expenditure account = the club's version of an income statement; result is a surplus or deficit.","Accumulated fund = the club's capital.","Subscriptions: adjust for amounts in arrears and in advance."]},
 {id:"manufacturing",sec:"s5",name:"Manufacturing Accounts",short:"Prime cost, factory overheads and cost of production",
  notes:["Prime cost = direct materials + direct labour + direct expenses.","Add factory overheads (indirect costs such as factory rent, supervisor wages).","Adjust for work in progress: + opening WIP − closing WIP = cost of production.","Cost of production then replaces purchases in the trading section."]},
 {id:"payroll",sec:"s5",name:"Payroll",short:"Gross pay, deductions and net pay",
  notes:["Gross pay can come from time rates, overtime, piece rates or commission.","Statutory deductions are required by law. In Trinidad and Tobago: NIS, PAYE income tax and Health Surcharge.","Voluntary deductions: union dues, credit union, insurance.","Net pay = gross pay − total deductions."]},
 {id:"incomplete",sec:"s5",name:"Incomplete Records",short:"Statement of affairs and finding profit without full books",
  notes:["Statement of affairs: assets − liabilities = capital at a date.","Net profit = closing capital − opening capital + drawings − capital introduced.","Use control-style accounts to find missing figures such as credit sales or purchases.","Use mark-up and margin to find missing sales or cost of sales."]},
];
const TOPIC = Object.fromEntries(TOPICS.map(t=>[t.id,t]));

/* Built-in question bank: used for the daily challenge and when the AI is unavailable */
const BANK = [
 {t:"intro",q:"Which concept says the owner's personal spending must be kept out of the business records?",o:["Going concern","Business entity","Consistency","Prudence"],a:1,why:"The business entity concept treats the business as separate from its owner. If Keisha pays her personal phone bill, it is not an expense of her roti shop.",trap:"Going concern is about assuming the business will keep running into the future, not about separating the owner."},
 {t:"intro",q:"A business values closing inventory at cost instead of its higher selling price. Which concept is this?",o:["Prudence","Accruals","Materiality","Dual aspect"],a:0,why:"Prudence means you do not overstate assets or profit. Inventory is shown at the lower of cost and net realisable value.",trap:"Accruals is about matching income and expenses to the period they belong to."},
 {t:"equation",q:"Ravi's Hardware has assets of $85,000 and liabilities of $23,000. What is the capital?",o:["$108,000","$62,000","$23,000","$85,000"],a:1,why:"Capital = Assets − Liabilities = $85,000 − $23,000 = $62,000.",trap:"Adding gives $108,000. The equation is A = C + L, so to find capital you subtract liabilities from assets."},
 {t:"equation",q:"A business buys equipment on credit from Massy Machinery. The effect is:",o:["Assets up, capital up","Assets up, liabilities up","Assets down, liabilities up","Assets up, capital down"],a:1,why:"Equipment is an asset, so assets rise. The business now owes Massy Machinery, so liabilities rise by the same amount.",trap:"Capital only changes when the owner invests or withdraws, or when there is a profit or loss."},
 {t:"sourcedocs",q:"Which document is used to write up the Returns Inwards (Sales Returns) Journal?",o:["Invoices sent to customers","Credit notes sent to customers","Debit notes received","Receipts"],a:1,why:"When a customer returns goods, the business sends them a credit note. Those credit notes are listed in the Returns Inwards Journal.",trap:"Invoices sent go in the Sales Journal, not the returns journal."},
 {t:"sourcedocs",q:"Which book of original entry records the purchase of a delivery van on credit?",o:["Purchases Journal","Cash Book","General Journal","Sales Journal"],a:2,why:"The Purchases Journal is only for goods bought for resale on credit. A van is a non-current asset, so it goes in the General Journal.",trap:"Students see 'on credit' and choose the Purchases Journal. Always ask: is this stock for resale?"},
 {t:"doubleentry",q:"Ali, a doubles vendor, pays rent of $1,200 in cash. The double entry is:",o:["Dr Cash, Cr Rent","Dr Rent, Cr Cash","Dr Rent, Cr Capital","Dr Capital, Cr Cash"],a:1,why:"Rent is an expense: expenses increase on the debit side. Cash (an asset) goes down, so credit Cash.",trap:"Many students debit Cash because 'cash is involved'. Ask which account increases and which decreases."},
 {t:"doubleentry",q:"Goods are sold on credit to Sasha for $3,000. Which entry is correct?",o:["Dr Sales, Cr Sasha","Dr Sasha, Cr Sales","Dr Sasha, Cr Purchases","Dr Purchases, Cr Sasha"],a:1,why:"Sasha now owes the business, so she is a debtor (asset): debit Sasha. Sales are income: credit Sales.",trap:"Reversing the entry is the most common mistake. Income always increases on the credit side."},
 {t:"doubleentry",q:"An account has debits totalling $9,400 and credits totalling $6,100. What is the balance brought down?",o:["$3,300 debit","$3,300 credit","$15,500 debit","$9,400 debit"],a:0,why:"The debit side is bigger by $9,400 − $6,100 = $3,300. 'Balance c/d' goes on the credit side to make both sides equal, then 'Balance b/d' comes down on the debit side.",trap:"Seeing c/d written on the credit side makes students think it is a credit balance. The b/d side is the real balance."},
 {t:"cashbook",q:"In a three-column cash book, discount allowed is recorded on the:",o:["Debit side","Credit side","Bank column only","General Journal only"],a:0,why:"Discount allowed is given to customers who pay us, so it sits on the debit (receipts) side next to that receipt. The column total is debited to Discount Allowed.",trap:"Discount received goes on the credit side, next to payments to suppliers."},
 {t:"cashbook",q:"A petty cash imprest is $800. At the end of the month $135 is left. How much is reimbursed?",o:["$800","$935","$665","$135"],a:2,why:"Reimbursement equals the amount spent: $800 − $135 = $665. That brings the float back to $800.",trap:"Do not reimburse the full imprest or the balance left. Top up only what was spent."},
 {t:"trialbalance",q:"Rent paid of $500 was debited to the Rates account. This is an error of:",o:["Principle","Commission","Omission","Original entry"],a:1,why:"Rent and Rates are both expense accounts. Posting to the wrong account of the same type is an error of commission.",trap:"An error of principle is posting to the wrong TYPE of account, such as treating an asset as an expense."},
 {t:"trialbalance",q:"Which error WILL make the trial balance totals disagree?",o:["Error of omission","Compensating error","Purchases debited $400, supplier credited $40","Complete reversal of entries"],a:2,why:"If the two sides of the entry are for different amounts, the debit and credit totals no longer match, so the trial balance will not agree.",trap:"Omission and reversal still affect both sides equally, so the totals still agree."},
 {t:"trialbalance",q:"The credit column of a trial balance is $250 more than the debit column. The suspense account is opened with:",o:["A debit of $250","A credit of $250","A debit of $500","A credit of $125"],a:0,why:"The debit side is short by $250, so you put $250 on the debit side in a Suspense account to make the totals agree.",trap:"Put the difference on the SHORT side, not the bigger one."},
 {t:"bankrec",q:"A cheque for $1,500 sent to a supplier has not yet been presented. Starting from the cash book balance, you:",o:["Add it","Subtract it","Ignore it","Enter it in the cash book again"],a:0,why:"The cash book already took the money out, but the bank has not. So the bank balance is higher: add unpresented cheques to the cash book balance.",trap:"Students subtract it because it is a payment. Think about which record is missing the item."},
 {t:"bankrec",q:"Bank charges of $60 appear only on the bank statement. What do you do first?",o:["Credit the bank column of the cash book","Debit the cash book","Add it in the reconciliation","Ignore it"],a:0,why:"Bank charges reduce the money in the bank. Update the cash book first by crediting the bank column with $60.",trap:"Items that only the bank knows about go into the cash book, not into the reconciliation statement."},
 {t:"control",q:"Which item goes on the CREDIT side of a Sales Ledger Control Account?",o:["Credit sales","Dishonoured cheques","Cash received from debtors","Opening debit balance"],a:2,why:"Money received from customers reduces what they owe, so it is credited, just as it would be in each customer's account.",trap:"Dishonoured cheques increase what debtors owe again, so they go on the debit side."},
 {t:"finalaccounts",q:"Sales $120,000, returns inwards $5,000, cost of sales $70,000. Gross profit is:",o:["$50,000","$45,000","$55,000","$115,000"],a:1,why:"Net sales = $120,000 − $5,000 = $115,000. Gross profit = $115,000 − $70,000 = $45,000.",trap:"Forgetting to deduct returns inwards gives $50,000."},
 {t:"finalaccounts",q:"Cost of sales is calculated as:",o:["Opening inventory + purchases − closing inventory","Purchases − sales","Opening inventory − purchases + closing inventory","Sales − gross profit + expenses"],a:0,why:"Start with what you had, add what you bought, and take away what is left. (Also add carriage inwards and deduct returns outwards from purchases.)",trap:"Mixing up opening and closing inventory signs is the usual slip."},

/* =================== SYNC (PC + phone, same progress) ===================
   A sync code links devices. The Worker stores one copy per code at /api/sync/<sha256>.
   Merging is three-way (base = what this device last synced): counters such as XP, coins
   and per-day XP add up what each device earned since then, records take the best,
   collections are combined, settings take the newer change. */
const SYNC_KEY = "ledgerup.sync.v1", SYNC_API = "/api/sync/";
const SYNC_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const SYNC_LOCAL = ["role","shopTab","filter","hideInstall","kid","pRewards","kidName","pendXP","pendBase","claimId"];
const SYNC_ADD = ["xp","coins","freezes"], SYNC_MAX = ["best"], SYNC_UNION = ["badges","owned","claimed","lessonDay"];
let SY = null; try{ SY = JSON.parse(localStorage.getItem(SYNC_KEY)||"null"); }catch(e){}
let syncBusy = false, syncAgain = false, syncT = null, syncErr = false;
const syncOK = () => STANDALONE && S.role!=="parent" && /^https:$/.test(location.protocol) && !!(window.crypto && crypto.subtle);
function sySave(){ try{ SY ? localStorage.setItem(SYNC_KEY, JSON.stringify(SY)) : localStorage.removeItem(SYNC_KEY); }catch(e){} }
function syncable(o){ const c = JSON.parse(JSON.stringify(o)); SYNC_LOCAL.forEach(k=>delete c[k]); return c; }
function newSyncCode(){ const a = new Uint32Array(12); crypto.getRandomValues(a); return [...a].map(x=>SYNC_ABC[x%SYNC_ABC.length]).join(""); }
const normCode = c => String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const showCode = c => c.replace(/(.{4})(?=.)/g,"$1-");
async function codeId(code){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ledgerup-sync|"+code)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

function mergeState(B, L, R){
  B = B||{}; const num = x => +x||0, same = (a,b) => JSON.stringify(a)===JSON.stringify(b);
  const add = (b,l,r) => Math.max(0, Math.round(num(r) + num(l) - num(b)));
  const pick = k => same(L[k], B[k]) ? (k in R ? R[k] : L[k]) : L[k];
  const M = {};
  new Set([...Object.keys(L), ...Object.keys(R)]).forEach(k => M[k] = pick(k));
  SYNC_ADD.forEach(k => M[k] = add(B[k], L[k], R[k]));
  SYNC_MAX.forEach(k => M[k] = Math.max(num(L[k]), num(R[k])));
  SYNC_UNION.forEach(k => M[k] = Object.assign({}, R[k]||{}, L[k]||{}));
  const addMap = (b,l,r) => { const o={}; new Set([...Object.keys(l||{}), ...Object.keys(r||{})]).forEach(d => o[d] = add((b||{})[d], (l||{})[d], (r||{})[d])); return o; };
  M.days = addMap(B.days, L.days, R.days);
  M.n = addMap(B.n, L.n, R.n);
  M.game = Object.assign({}, R.game, L.game, {best: Math.max(num(L.game?.best), num(R.game?.best))});
  M.topics = {};
  new Set([...Object.keys(L.topics||{}), ...Object.keys(R.topics||{})]).forEach(id => {
    const b = (B.topics||{})[id]||{}, l = (L.topics||{})[id]||{}, r = (R.topics||{})[id]||{}, t = {};
    new Set([...Object.keys(l), ...Object.keys(r)]).forEach(f => {
      t[f] = f==="best" ? Math.max(num(l[f]), num(r[f])) : (typeof (l[f]??r[f])==="number" ? add(b[f], l[f], r[f]) : (same(l[f], b[f]) ? (f in r ? r[f] : l[f]) : l[f]));
    });
    M.topics[id] = t;
  });
  const seen = new Set(); M.mistakes = [...(L.mistakes||[]), ...(R.mistakes||[])].filter(m => { const k = m.t+"|"+m.q; if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b) => String(b.d||"").localeCompare(String(a.d||""))).slice(0,40);
  const lL = String(L.last||""), lR = String(R.last||"");
  if(lL > lR){ M.last = L.last; M.streak = L.streak; } else if(lR > lL){ M.last = R.last; M.streak = R.streak; } else { M.last = L.last ?? R.last; M.streak = Math.max(num(L.streak), num(R.streak)); }
  ["daily","chestDay"].forEach(k => { const a = L[k]||"", b = R[k]||""; M[k] = (a > b ? a : b) || null; });
  M.best = Math.max(M.best, num(M.streak));
  return M;
}
function syncApply(M){
  const keep = {}; SYNC_LOCAL.forEach(k => { if(k in S) keep[k] = S[k]; });
  const before = JSON.stringify(syncable(S));
  S = Object.assign(DEF(), JSON.parse(JSON.stringify(M)), keep);
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(before !== JSON.stringify(syncable(S))){ applyTheme(); if(!["structured","game","quiz","tutor","cards"].includes(tab)) render(); else renderHeader(); }
}
function syncSoon(ms){ if(!SY || !syncOK()) return; clearTimeout(syncT); syncT = setTimeout(()=>syncNow(), ms ?? 12000); }
async function syncNow(manual){
  if(!SY || !syncOK()) return false;
  if(!navigator.onLine){ if(manual) toast("You're offline. It will sync when you're back online."); return false; }
  if(syncBusy){ syncAgain = true; return false; }
  syncBusy = true; clearTimeout(syncT); let ok = false;
  try{
    let r = await fetch(SYNC_API+SY.id, {cache:"no-store"}).then(x => { if(!x.ok) throw 0; return x.json(); });
    for(let i=0; i<4; i++){
      const L = syncable(S);
      if(r.v === SY.v && SY.base && JSON.stringify(L) === JSON.stringify(SY.base)){ ok = true; break; }
      const M = (r.data && r.v !== SY.v) ? mergeState(SY.base, L, JSON.parse(r.data)) : L;
      const p = await fetch(SYNC_API+SY.id, {method:"PUT", headers:{"content-type":"application/json"}, body: JSON.stringify({ifV: r.v, data: JSON.stringify(M)})});
      if(p.status === 409){ r = await p.json(); continue; }
      if(!p.ok) throw 0;
      const res = await p.json();
      syncApply(M); SY.v = res.v; SY.base = JSON.parse(JSON.stringify(M)); ok = true; break;
    }
  }catch(e){ ok = false; }
  syncBusy = false; syncErr = !ok;
  if(ok){ SY.at = Date.now(); sySave(); }
  if(manual) toast(ok ? "Synced" : "Couldn't sync. Check your internet and try again.", ok);
  if(tab==="me" && document.getElementById("syncCard")) renderSyncCard();
  if(syncAgain){ syncAgain = false; syncSoon(1500); }
  return ok;
}
async function syncTurnOn(){
  const code = newSyncCode();
  SY = {code, id: await codeId(code), v: 0, base: null, at: null}; sySave();
  const ok = await syncNow();
  if(!ok){ SY = null; sySave(); toast("Couldn't turn on sync. Check your internet and try again."); }
  else toast("Sync is on", true);
  render();
}
async function syncJoin(raw){
  const code = normCode(raw);
  if(code.length !== 12){ toast("A sync code has 12 letters and numbers, like ABCD-EFGH-JKMN."); return false; }
  const id = await codeId(code);
  let r; try{ r = await fetch(SYNC_API+id, {cache:"no-store"}).then(x => x.json()); }catch(e){ toast("Couldn't connect. Check your internet and try again."); return false; }
  if(!r.data){ toast("No progress found for that code. Check it and try again."); return false; }
  // Base for joining: settings as they are here (so the other device's settings win), counters at zero (so both devices' progress adds up).
  const L = syncable(S);
  const base = Object.assign(JSON.parse(JSON.stringify(L)), {xp:0,coins:0,freezes:0,best:0,n:{},days:{},topics:{},badges:{},owned:{},claimed:{},lessonDay:{},mistakes:[],game:{best:0}});
  if(!S.name) base.name = L.name;
  SY = {code, id, v: -1, base, at: null}; sySave();
  const ok = await syncNow();
  if(!ok){ SY = null; sySave(); toast("Couldn't sync. Check your internet and try again."); return false; }
  toast(`Synced! Welcome back${S.name ? ", "+S.name : ""}.`, true);
  go(S.name ? "home" : "me");
  return true;
}

function bindSyncJoin(id){ const b = document.getElementById(id+"-go"); if(!b) return; b.onclick = async ()=>{ b.disabled = true; b.textContent = "…"; const ok = await syncJoin(document.getElementById(id).value); if(!ok && document.getElementById(id+"-go")){ b.disabled = false; b.textContent = "Join"; } }; }

const pad = n => String(n).padStart(2,"0");
const dstr = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dstr(new Date());
const yesterday = () => { const d=new Date(); d.setDate(d.getDate()-1); return dstr(d); };
function gapDays(a){ if(!a) return 999; const [y,m,d]=a.split("-").map(Number); const t=new Date(); const x=new Date(y,m-1,d); t.setHours(0,0,0,0); return Math.round((t-x)/86400000); }
function liveStreak(){ const g=gapDays(S.last); return g<=1 || (g-1)<=(S.freezes||0) ? S.streak : 0; }
function levelOf(xp){ let L=1; while(50*L*(L+1) <= xp) L++; return L; }
function levelFloor(L){ return 50*(L-1)*L; }
function levelName(L){ return LEVELS[Math.min(L-1, LEVELS.length-1)]; }

function pendingCounts(){ const b=S.pendBase||{}; return {t:Math.max(0,(S.n.tutor||0)-(b.tutor||0)), s:Math.max(0,(S.n.structured||0)-(b.structured||0)), p:Math.max(0,(S.n.photo||0)-(b.photo||0))}; }
function claimURL(){ const x=S.pendXP||0, c=pendingCounts(), id=(S.claimId ||= Math.random().toString(36).slice(2,8)); const chk=hashStr(`${x}|${c.t}|${c.s}|${c.p}|${id}|${CLAIM_KEY}`)%100000; return `${APP_URL}/#claim-x${x}t${c.t}s${c.s}p${c.p}-${id}-${chk}`; }
function markClaimSent(){ S.pendXP=0; S.pendBase={tutor:S.n.tutor,structured:S.n.structured,photo:S.n.photo}; S.claimId=null; save(); renderHeader(); }
function handleClaim(){
  const m = location.hash.match(/^#claim-x(\d+)t(\d+)s(\d+)p(\d+)-([a-z0-9]+)-(\d+)$/); if(!m || COACH_MODE || S.role==="parent") return;
  try{ history.replaceState(null,"",location.pathname); }catch(e){ location.hash=""; }
  const [_,x,t,s2,p,id,chk] = m; S.claimed ||= {};
  if(String(hashStr(`${x}|${t}|${s2}|${p}|${id}|${CLAIM_KEY}`)%100000)!==chk){ toast("That points link didn't work."); return; }
  if(S.claimed[id]){ toast("Those Coach points were already added."); return; }
  S.claimed[id]=today(); const keys=Object.keys(S.claimed); if(keys.length>60) delete S.claimed[keys[0]];
  S.n.tutor+=+t; S.n.structured+=+s2; S.n.photo+=+p;
  if(+x>0) addXP(Math.min(+x,1000), "from Coach"); else { checkBadges(); save(); toast("Coach activity added"); }

function addXP(n, why){
  if(n<=0) return;
  if(COACH_MODE){ S.pendXP=(S.pendXP||0)+n; save(); renderHeader(); toast(`+${n} XP · add it to Ledger Up when you're done`); return; }
  const before = levelOf(S.xp);
  S.xp += n;
  S.coins += n;
  const t = today(); const prevDay = S.days[t]||0; S.days[t] = prevDay + n;
  if(S.last !== t){ const g=gapDays(S.last);
    if(g===1) S.streak++;
    else if(g>1 && g<900 && (g-1)<=(S.freezes||0)){ S.freezes-=(g-1); S.streak++; setTimeout(()=>toast(`A streak freeze saved your ${S.streak-1}-day streak!`, true),1200); }
    else S.streak = 1;
    S.last = t; S.best = Math.max(S.best, S.streak); }
  const after = levelOf(S.xp);
  if(after>before){ S.coins += 50; queueModal(()=>showLevelUp(after)); }
  if(prevDay < DAILY_GOAL && S.days[t] >= DAILY_GOAL && S.chestDay!==t) queueModal(showChest);
  checkBadges(); checkParentGoals();
  save(); renderHeader();
  toast(`+${n} XP · ${why}`);
}
function award(id){
  if(S.badges[id]) return;
  S.badges[id] = today(); S.coins += 25;
  const b = BADGES.find(x=>x.id===id);
  queueModal(()=>showBadge(b));
}
function checkBadges(){
  const st = liveStreak();

  if(S.n.perfect>=1) award("perfect");
  if(st>=3) award("streak3"); if(st>=7) award("streak7"); if(st>=30) award("streak30");
  if(S.n.daily>=5) award("daily5");
  if(S.n.tutor>=20) award("curious");
  if(S.n.structured>=3) award("paper2");
  if((S.game.best||0)>=15) award("game");
  if(Object.values(S.topics).filter(t=>(t.best||0)>=80).length>=5) award("master5");
  const secs = new Set(Object.keys(S.topics).filter(k=>S.topics[k].attempts).map(k=>TOPIC[k]?.sec));
  if(SECTIONS.every(s=>secs.has(s.id))) award("allround");

}

function weakTopics(n=3){

/* =================== MARKDOWN =================== */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inl(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g,"$1<em>$2</em>");
  return s;
}
function mdTable(rows){
  const cells = r => r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const isSep = r => /^\s*\|?\s*:?-{2,}/.test(r) && /^[\s|:\-]+$/.test(r);
  let head = null, body = rows;
  if(rows.length>1 && isSep(rows[1])){ head = cells(rows[0]); body = rows.slice(2); }
  body = body.filter(r=>!isSep(r));
  let h = '<div class="tbl"><table>';
  if(head) h += "<thead><tr>"+head.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead>";
  h += "<tbody>"+body.map(r=>"<tr>"+cells(r).map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
  return h;
}
function md(src){
  const L = String(src||"").replace(/\r/g,"").split("\n"); const out=[]; let i=0;
  const startRe = /^(```|#{1,6}\s|\s*[-*•]\s+|\s*\d+[.)]\s+|\s*\|.*\|\s*$|\s*(---|\*\*\*)\s*$)/;
  while(i<L.length){
    const l = L[i];
    if(/^```/.test(l)){ const lang=(l.match(/^```\s*([\w-]+)/)||[])[1]; const b=[]; i++; let closed=false; while(i<L.length){ if(/^```/.test(L[i])){ closed=true; break; } b.push(L[i++]); } i++;
      const vis = lang && VIS_FENCE[lang.toLowerCase()] ? (closed ? fenceVisual(lang, b.join("\n")) : `<p class="muted"><i>Drawing a diagram…</i></p>`) : null;
      out.push(vis || "<pre>"+esc(b.join("\n"))+"</pre>"); continue; }
    if(/^\s*\|.*\|\s*$/.test(l)){ const r=[]; while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])) r.push(L[i++]); out.push(mdTable(r)); continue; }
    const h = l.match(/^(#{1,6})\s+(.*)/); if(h){ const lv=Math.min(6,h[1].length+2); out.push(`<h${lv}>${inl(h[2])}</h${lv}>`); i++; continue; }
    if(/^\s*[-*•]\s+/.test(l)){ const it=[]; while(i<L.length && /^\s*[-*•]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*[-*•]\s+/,"")); out.push("<ul>"+it.map(x=>"<li>"+inl(x)+"</li>").join("")+"</ul>"); continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ const it=[]; const st=parseInt(l,10)||1; while(i<L.length && /^\s*\d+[.)]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*\d+[.)]\s+/,"")); out.push(`<ol start="${st}">`+it.map(x=>"<li>"+inl(x)+"</li>").join("")+"</ol>"); continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(!l.trim()){ i++; continue; }
    const p=[L[i++]]; while(i<L.length && L[i].trim() && !startRe.test(L[i])) p.push(L[i++]);
    out.push("<p>"+inl(p.join(" "))+"</p>");
  }
  return out.join("");
}

async function runLesson(t, example){

    ? `Give ONE new, realistic CSEC-style worked example on "${t.name}" (${t.short}). Set it in a Trinidad and Tobago business with TT$ figures. Show the question first, then solve it in numbered steps with all working, using tables for accounts/statements. End with "Exam tip:" and one sentence. Make it different from a typical textbook example. Random seed: ${Math.random().toString(36).slice(2,7)}.`
    : `Teach the topic "${t.name}" (${t.short}) as a short lesson for a student who is struggling with it. Use these headings: "### In one sentence", "### Key words", "### Step by step", "### Worked example" (Caribbean business, TT$, with tables for any accounts or statements), "### Mistakes examiners see", "### Quick check" (one question; put the answer on the last line after "Answer:").`);
  try{
    await aiCall(prompt, {signal:lessonCtl.signal, cache: example?false:{gcTime:86400000}, effort: "low", onText:({text})=>{ out.innerHTML = md(text); }});

    const k = t.id+(example?"x":"l");

/* =================== QUIZ =================== */
let Q = null;
async function startQuiz({topic=null, mixed=false, daily=false, n=5, paper1=false}={}){
  Q = {topic, daily, mixed, paper1, items:[], i:0, picked:null, results:[], loading:true, note:"", xp:0};
  go("quiz");
  if(daily){ Q.items=[fromBank(dailyQ())]; Q.loading=false; return render(); }
  const topics = topic ? [TOPIC[topic]] : pickMixed(paper1?6:4);
  if(AI){
    try{
      const items = await aiJSON(
`You write multiple-choice practice questions for a student in Trinidad and Tobago preparing for CXC CSEC Principles of Accounts (Paper 01 style).
${topic?`Topic: ${topics[0].name} (${topics[0].short}).`:`Mix these topics: ${topics.map(t=>t.name).join("; ")}.`}
Write ${n} questions at real CSEC level. Mix concept questions with short calculations. Use Caribbean names, businesses and TT$ amounts. Work out every calculation carefully and check that exactly one option is correct.
Reply with only a JSON array. Each item: {"topic": "<one of: ${topics.map(t=>t.id).join(", ")}>", "q": "question", "options": ["A","B","C","D"], "answer": <index 0-3>, "why": "2-4 short sentences explaining step by step why the answer is correct, showing the working", "trap": "1-2 sentences naming the mistake behind the most tempting wrong option and how to avoid it"}
Random seed: ${Math.random().toString(36).slice(2,8)}`);
      const ok = (Array.isArray(items)?items:[]).filter(x=>x && typeof x.q==="string" && Array.isArray(x.options) && x.options.length===4 && Number.isInteger(+x.answer) && +x.answer>=0 && +x.answer<4)
        .map(x=>({t: TOPIC[x.topic]?x.topic:topics[0].id, q:x.q, o:x.options.map(String), a:+x.answer, why:String(x.why||""), trap:String(x.trap||"")}));
      if(ok.length>=Math.min(3,n)){ Q.items = ok.slice(0,n); Q.loading=false; return tab==="quiz" && render(); }
      Q.note = "Coach's questions came back incomplete, so here are questions from the built-in bank.";
    }catch(e){ if(e.code==="cancelled") return; Q.note = aiErr(e)+" Using questions from the built-in bank instead."; }
  } else Q.note = "Using questions from the built-in bank (the AI coach isn't available here).";
  const pool = BANK.filter(b=>topics.some(t=>t.id===b.t));
  Q.items = shuffle(pool.length?pool:BANK).slice(0,n).map(fromBank);
  if(Q.items.length < n) Q.items = Q.items.concat(shuffle(BANK.filter(b=>!pool.includes(b))).slice(0,n-Q.items.length).map(fromBank));
  Q.loading=false; if(tab==="quiz") render();
}
function fromBank(b){
  const order = shuffle([0,1,2,3]);
  return {t:b.t, q:b.q, o:order.map(i=>b.o[i]), a:order.indexOf(b.a), why:b.why, trap:b.trap};
}
function pickMixed(k){
  const weak = weakTopics(2);
  return shuffle(weak.concat(shuffle(TOPICS.filter(t=>!weak.includes(t))).slice(0,k-weak.length)));
}
function viewQuiz(v){
  if(!Q) return go("practice");
  const title = Q.daily?"Daily challenge":Q.topic?TOPIC[Q.topic].name:Q.paper1?"Paper 01 practice":"Mixed quiz";
  if(Q.loading){ v.innerHTML = `<button class="back" id="bk">← Back</button><div class="card"><span class="eyebrow">${esc(title)}</span><h3 style="margin-top:6px">Coach is writing fresh questions for you</h3><p class="muted">This can take up to a minute. Every quiz is new.</p>${thinking("Writing questions")}</div>`; $("#bk").onclick=()=>{Q=null;go("practice");}; return; }
  if(Q.i >= Q.items.length) return quizDone(v, title);
  const it = Q.items[Q.i], picked = Q.picked;
  const prog = Q.items.map((_,k)=>`<i class="${k<Q.i?(Q.results[k]?"ok":"bad"):k===Q.i?"now":""}"></i>`).join("");
  let fb = "";
  if(picked!==null){
    const right = picked===it.a;
    fb = right
      ? `<div class="fb ok"><h4>Correct! +10 XP</h4><div><span class="lbl">Why it's right</span><div>${esc(it.why)}</div></div></div>`
      : `<div class="fb bad"><h4>Not quite. The answer is ${"ABCD"[it.a]}.</h4>
          <div><span class="lbl">Why ${"ABCD"[it.a]} is right</span><div>${esc(it.why)}</div></div>
          ${it.trap?`<div class="fixbox"><span class="lbl">Where it went wrong and how to fix it</span><div>${esc(it.trap)}</div></div>`:""}
          <button class="btn line sm" id="qAsk" style="align-self:flex-start">Still confused? Ask Coach</button></div>`;
  }
  v.innerHTML = `
  <div class="qtop"><button class="back" id="bk">← Quit</button><span class="eyebrow">${esc(title)}</span></div>
  ${Q.note?`<div class="banner">${esc(Q.note)}</div>`:""}
  <div class="card qcard">
    <div class="qtop"><div class="qprog">${prog}</div><span class="eyebrow" style="margin-left:8px">${Q.i+1}/${Q.items.length}</span></div>
    <span class="eyebrow">${esc(TOPIC[it.t]?.name||"")}</span>
    <div class="qtext">${esc(it.q)}</div>
    <div class="opts">${it.o.map((o,k)=>`<button class="opt ${picked===null?"":k===it.a?"ok":k===picked?"bad":""}" data-k="${k}" ${picked!==null?"disabled":""}><span class="L">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${fb}
    ${picked!==null?`<button class="btn block" id="qNext">${Q.i+1<Q.items.length?"Next question":"See my results"}</button>`:""}
  </div>`;
  $("#bk").onclick = ()=>{ Q=null; go("practice"); };
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(Q.picked!==null) return;
    Q.picked = +b.dataset.k; (Q.picks ||= [])[Q.i] = Q.picked; const right = Q.picked===it.a; Q.results[Q.i]=right;
    if(right){ Q.xp += 10; addXP(10, "correct answer"); }
    else { logMistake(it.t, it.q, it.o[Q.picked], it.o[it.a], it.trap); save(); }
    render();
    setTimeout(()=>$(".fb")?.scrollIntoView({behavior:"smooth",block:"nearest"}),50);
  });
  if($("#qNext")) $("#qNext").onclick = ()=>{ Q.i++; Q.picked=null; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  if($("#qAsk")) $("#qAsk").onclick = ()=>{ chatTopic = it.t; pendingChat = `I got this quiz question wrong and I don't understand why.\n\nQuestion: ${it.q}\nOptions: ${it.o.map((o,k)=>"ABCD"[k]+") "+o).join("  ")}\nI chose: ${it.o[picked]}\nCorrect answer: ${it.o[it.a]}\n\nPlease explain step by step where my thinking went wrong and how to get it right next time.`; go("tutor"); };
}
function quizDone(v, title){
  const right = Q.results.filter(Boolean).length, total = Q.items.length, pct = Math.round(right/total*100);
  if(!Q.finished){
    Q.finished = true;
    if(Q.daily){ S.daily = today(); S.n.daily++; addXP(30, "daily challenge"); }
    else {
      S.n.quiz++; if(pct===100) S.n.perfect++;
      const per = {};
      Q.items.forEach((it,k)=>{ (per[it.t] ||= [0,0]); per[it.t][1]++; if(Q.results[k]) per[it.t][0]++; });
      for(const [tid,[r,n]] of Object.entries(per)){ const st=topicStat(tid); st.attempts++; if(Q.topic||n>=2||st.best===0) st.best=Math.max(st.best, Math.round(r/n*100)); }
      addXP(20 + (pct===100?30:0), pct===100?"perfect quiz bonus":"quiz complete");
    }
  }
  const wrong = Q.items.map((it,k)=>({it,k})).filter(x=>!Q.results[x.k]);
  const msg = pct===100?"Perfect. Those books balance.":pct>=80?"Strong work. You're close to mastering this.":pct>=50?"Good effort. Let's fix the ones you missed.":"This topic needs more practice. That's what Coach is for.";
  v.innerHTML = `
  <div class="hero"><div class="ledgerlines"></div><span class="eyebrow" style="color:inherit;opacity:.8">${esc(title)}</span>
    <div class="big">${right}/${total}</div><h2>${msg}</h2></div>
  ${wrong.length?`<div class="card"><span class="eyebrow">What you missed</span><div class="view" style="gap:12px;margin-top:8px">${wrong.map(({it})=>`<div class="mistake"><b>${esc(it.q)}</b><span>Answer: ${esc(it.o[it.a])}</span>${it.trap?`<span class="muted">${esc(it.trap)}</span>`:""}</div>`).join("")}</div>
   <button class="btn gold block" id="qReview" style="margin-top:12px">Go over my mistakes with Coach</button></div>`:""}
  <div class="grid2">
    ${Q.daily?"":`<button class="btn" id="qAgain">Another quiz</button>`}
    <button class="btn ghost" id="qHome">Back to home</button>
  </div>`;
  if($("#qAgain")) $("#qAgain").onclick = ()=>startQuiz({topic:Q.topic, paper1:Q.paper1, n:Q.items.length});
  $("#qHome").onclick = ()=>{ Q=null; go("home"); };
  if($("#qReview")) $("#qReview").onclick = ()=>{
    S.n.review++; checkBadges(); save();
    chatTopic = Q.topic || null;
    pendingChat = "I just finished a quiz. Please go through the questions I got wrong, one at a time. For each, explain step by step what I misunderstood and give me a similar question to try.\n\n" +
      wrong.map(({it,k},n)=>`${n+1}. ${it.q}\n   I chose: ${it.o[Q.picks?.[k]] ?? "?"}\n   Correct: ${it.o[it.a]}`).join("\n");
    go("tutor");
  };
}

  const log = $("#chatLog");

function pickImage(cb){

function bubble(m){
  if(m.role==="user") return `<div class="msg me">${esc(m.content)}${m.img?`<span class="imgtag">📷 Photo attached</span>`:""}</div>`;
  return `<div class="msg ai"><div class="md">${m.pending?thinking():md(m.content)}</div>${m.err?`<p class="banner" style="margin:8px 0 0">${esc(m.err)}</p>`:""}</div>`;
}
async function sendChat(text){
  if(chatBusy) return;
  const img = pendingImg; pendingImg = null;
  chat.push({role:"user", content:text, img:!!img});
  const aiMsg = {role:"assistant", content:"", pending:true}; chat.push(aiMsg);

  window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});

  while(turns.length && turns[0].role!=="user") turns.shift();
  const ctx = RULES() + (chatTopic && TOPIC[chatTopic] ? `\n\nThe student is currently studying: ${TOPIC[chatTopic].name} (${TOPIC[chatTopic].short}).` : "") + (img? "\n\nIf a photo is attached, read it carefully. If it is the student's working, mark it line by line: what is right, the exact line that is wrong, why, and the correct version. If it is a past paper question, help them solve it step by step." : "");
  try{
    const opts = {signal:chatCtl.signal, cache:false, onText:({text})=>{ aiMsg.pending=false; aiMsg.content=text; const n=$("#chatLog")?.lastElementChild; if(n && tab==="tutor") n.querySelector(".md").innerHTML = md(text); }};
    if(img) opts.images = [img.file];
    else if(text.length < 160 && turns.length <= 3 && !/solution|mark|check my|working|step by step|paper/i.test(text)) opts.modelTier = "quick";
    const r = await aiCall([{role:"user",content:ctx}, ...turns], opts);
    aiMsg.pending=false; aiMsg.content = r.text;
    S.n.tutor++; if(img){ S.n.photo++; }
    const k="tutor"; if((S.lessonDay[k+today()]||0) < 10){ S.lessonDay[k+today()] = (S.lessonDay[k+today()]||0)+1; addXP(img?8:4, img?"photo checked":"asked Coach"); } else { checkBadges(); save(); }
  }catch(e){
    aiMsg.pending=false; aiMsg.content = e.text || "";
    if(e.code!=="cancelled") aiMsg.err = aiErr(e); else if(!aiMsg.content) aiMsg.content = "_Stopped._";
  }
  chatBusy = false; if(tab==="tutor") render();
}

async function markStructured(){

${q.scenario}

${q.parts.map((p,k)=>`${p.label} ${p.task} [${p.marks} marks]\nStudent's answer: ${(P2.answers[k]||"").trim()||"(left blank"+(P2.img?" – see the attached photo of the student's working)":")")}`).join("\n\n")}

Reply with only JSON: {"parts": [{"awarded": number, "feedback": "1-3 sentences: what they got right, then exactly which line or figure is wrong and why", "fix": "the correct working for what they missed, step by step (Markdown, use a table for accounts)"}], "total": number, "summary": "one encouraging sentence on how to improve", "model": "a full model answer in Markdown with tables for accounts/statements"}
The parts array must have exactly ${q.parts.length} items in order.`, Object.assign(opts,{effort:"medium"}));
    if(!r || !Array.isArray(r.parts)) throw {code:"invalid_json"};
    r.parts = q.parts.map((p,k)=>{ const x=r.parts[k]||{}; return {awarded:Math.max(0,Math.min(p.marks, Math.round(+x.awarded||0))), feedback:String(x.feedback||""), fix:String(x.fix||"")}; });
    r.total = r.parts.reduce((s,p)=>s+p.awarded,0);

    S.n.structured++; if(P2.img) S.n.photo++;
    const total=q.parts.reduce((s,p)=>s+p.marks,0); const pct=Math.round(r.total/Math.max(1,total)*100);

  <div class="gcard ${G.flash||""}" id="gCard"><div class="tx">${esc(c[0])}</div><span class="muted">Which side for this account?</span><span class="acct">${esc(c[1])}</span></div>
  <div class="dc"><button class="btn" style="background:var(--dr);color:#fff" data-dc="D">Dr</button><button class="btn" style="background:var(--cr);color:#fff" data-dc="C">Cr</button></div>`;
  v.querySelectorAll("[data-dc]").forEach(b=>b.onclick=()=>answerDC(b.dataset.dc));

function explainDC(w){
  const a = w[1].toLowerCase();
  if(/sales|commission|rent received|discount received|returns outwards/.test(a)) return "Income (or a reduction of purchases) increases on the credit side.";
  if(/capital|loan|furniture world|ramdass/.test(a)) return w[2]==="C"?"Liabilities and capital increase on the credit side.":"Paying back a liability reduces it, so debit it.";
  if(/drawings/.test(a)) return "Drawings increase on the debit side.";
  if(/bad debts|wages|electricity|insurance|discount allowed|returns inwards|purchases/.test(a)) return "Expenses (and purchases, returns inwards) increase on the debit side.";
  return w[2]==="D"?"This asset (or what someone owes us) increases, or a liability decreases, so it is debited.":"This asset decreases (money or value going out), or the person now owes us less, so it is credited.";
}
function startGame(){
  stopGame();
  G = {state:"play", deck:shuffle(GAME), i:0, score:0, right:0, combo:0, wrong:[], left:45, flash:""};
  render();
  const t0 = Date.now();
  gTimer = setInterval(()=>{ G.left = Math.max(0, 45 - (Date.now()-t0)/1000); const b=$("#gBar"); if(b) b.style.width=(G.left/45*100)+"%"; if(G.left<=0) endGame(); }, 200);
}
function answerDC(side){
  if(G.state!=="play") return;
  const c = G.deck[G.i % G.deck.length];
  if(side===c[2]){ G.combo++; G.right++; G.score += 1 + (G.combo>=3?1:0); G.flash="flashok"; }
  else { G.combo=0; G.wrong.push(c); G.flash="flashbad"; }
  G.i++; render(); setTimeout(()=>{ G.flash=""; const gc=$("#gCard"); if(gc) gc.className="gcard"; }, 300);
}
function endGame(){
  stopGame(); G.state="over";
  G.newBest = G.score > (S.game.best||0); if(G.newBest) S.game.best = G.score;
  G.wrong.forEach(w=>{ const t=topicStat("doubleentry"); t.wrong++; });
  if(G.score>0) addXP(G.score*2, "Debit or Credit"); else save();
  render();
}

const fmt = n => { n = Math.round((+n||0)*100)/100; const a = Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:2}); return n<0 ? `(${a})` : a; };
const money = n => (n<0?"($":"$") + Math.abs(Math.round((+n||0)*100)/100).toLocaleString("en-US",{maximumFractionDigits:2}) + (n<0?")":"");

function tAccountHTML(a, newKeys){
  const norm = arr => (Array.isArray(arr)?arr:[]).map(x=>Array.isArray(x)?[String(x[0]??""), +x[1]||0, x[2]]:[String(x?.label??x?.details??""), +(x?.amount??x?.amt)||0, x?.k]);
  let D = norm(a.dr), C = norm(a.cr);
  const sD = D.reduce((s,x)=>s+x[1],0), sC = C.reduce((s,x)=>s+x[1],0);
  let bd = null, total = null;
  if(a.balance && (D.length||C.length)){
    const diff = sD - sC;
    if(diff>0){ C.push(["Balance c/d", diff, "cd"]); bd = ["d", diff]; }
    else if(diff<0){ D.push(["Balance c/d", -diff, "cd"]); bd = ["c", -diff]; }
    total = Math.max(sD, sC);
  }

 ["Debit note","Sent to a supplier to ask them to reduce what you owe (e.g. after returning goods)."],["Contra entry","An entry on both sides of the cash book, e.g. cash paid into the bank."],
 ["Imprest system","Petty cash starts each period with a fixed float, topped up by exactly what was spent."],["Trial balance","A list of all ledger balances to check that total debits equal total credits."],
 ["Suspense account","A temporary account holding the difference when the trial balance doesn't agree."],["Error of principle","Posting to the wrong TYPE of account, e.g. treating a van as an expense."],
 ["Error of commission","Posting to the wrong account of the right type, e.g. Rent posted to Rates."],["Unpresented cheque","A cheque you've written that the bank hasn't paid out yet."],
 ["Accrued expense","An expense used this year but not yet paid. Add it to the expense; show it as a current liability."],["Prepaid expense","An expense paid in advance for next year. Subtract it from the expense; show it as a current asset."],
 ["Depreciation","Spreading the cost of a non-current asset over its useful life."],["Net book value","Cost minus total depreciation to date."],
 ["Provision for doubtful debts","An estimate of debts that may not be paid, taken off trade receivables."],["Gross profit","Net sales − cost of sales."],
 ["Net profit","Gross profit + other income − expenses."],["Working capital","Current assets − current liabilities."],
 ["FIFO","First In, First Out: the oldest stock is sold first, so closing inventory is at the latest prices."],["Appropriation account","Shows how a partnership's net profit is shared between partners."],
 ["Accumulated fund","The capital of a club or non-profit organisation."],["Subscriptions in arrears","Members' fees still owed to the club at the year end."],
 ["Prime cost","Direct materials + direct labour + direct expenses."],["Statutory deduction","A pay deduction required by law, e.g. NIS, PAYE, Health Surcharge."],
 ["Debenture","A long-term loan to a company. Debenture holders get interest, not dividends."],["Statement of affairs","A list of assets and liabilities used to find capital when records are incomplete."],
];
let FC = null;

  const c = FC.deck[FC.i];

let parentOK = false;
function parentGate(){
  if(parentOK) return parentEditor();
  const setting = !S.parent.pin; let entry="", first=null;
  const draw = (msg)=>{
    $("#modalRoot .box").innerHTML = `<span class="eyebrow">Parents only</span><h2>${setting?(first===null?"Create a 4-digit PIN":"Enter the PIN again"):"Enter your PIN"}</h2>
      <p class="muted" style="margin:0;font-size:14px">${msg||(setting?"Your child won't be able to change rewards without it.":"")}</p>
      <div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<entry.length?"on":""}"></i>`).join("")}</div>
      <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="x" aria-label="Cancel">✕</button><button data-k="0">0</button><button data-k="b" aria-label="Delete">⌫</button></div>`;
    $("#modalRoot .box").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));
  };
  const press = k => {
    if(k==="x"){ $("#modalRoot").innerHTML=""; return; }
    if(k==="b"){ entry=entry.slice(0,-1); return draw(); }
    if(entry.length<4) entry+=k;
    if(entry.length<4) return draw();
    if(setting){
      if(first===null){ first=entry; entry=""; return draw(); }
      if(first!==entry){ first=null; entry=""; return draw("The PINs didn't match. Try again."); }
      S.parent.pin = String(hashStr("ledgerup:"+entry)); save(); parentOK=true; $("#modalRoot").innerHTML=""; return parentEditor();
    }
    if(String(hashStr("ledgerup:"+entry))===S.parent.pin){ parentOK=true; $("#modalRoot").innerHTML=""; return parentEditor(); }
    entry=""; draw("That PIN isn't right.");
  };
  modal("", ()=>draw());
}
